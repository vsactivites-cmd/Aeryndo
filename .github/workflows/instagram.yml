name: Robot Instagram

# Déclenché à l'heure exacte par cron-job.org → https://www.aeryndo.co/api/igtrigger?slot=… (créneau forcé).
# Le cron GitHub ci-dessous n'est qu'un filet de sécurité : GitHub l'exécute quand il veut (4 à 7 fois par
# jour constaté), le script regarde alors l'heure LOCALE de chaque marché (content/markets.json) et ne fait
# quelque chose que dans une fenêtre de publication. Jamais deux fois le même créneau le même jour.
on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Créneau à forcer (piege, deal, reel, story-piege, story-deal, story-reel) — vide = créneaux dus maintenant"
        required: false
        default: ""
      market:
        description: "Marché (fr)"
        required: false
        default: "fr"
      dry:
        description: "Brouillon : 1 = préparer sans publier, 0 = publier, vide = suivre la variable IG_DRY_RUN"
        required: false
        default: ""

concurrency:
  group: instagram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Date du jour
        run: echo "TODAY=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Branche media (médias publics + état du robot)
        run: |
          if git ls-remote --exit-code --heads origin media >/dev/null; then
            git fetch --depth=1 origin media:media
            echo "branche media existante"
          else
            EMPTY=$(git hash-object -t tree /dev/null)
            ROOT=$(git -c user.name=aeryndo-robot -c user.email=robot@aeryndo.co commit-tree "$EMPTY" -m "Médias Instagram")
            git branch media "$ROOT"
          fi
          git worktree add ig-media media

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dépendances
        working-directory: instagram
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          which ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)

      - name: Publier
        working-directory: instagram
        env:
          # publication réelle uniquement si la variable de dépôt IG_DRY_RUN vaut exactement 0
          IG_DRY_RUN: ${{ vars.IG_DRY_RUN == '0' && '0' || '1' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MEDIA_BASE: https://raw.githubusercontent.com/${{ github.repository }}/media
          IN_SLOT: ${{ github.event.inputs.slot }}
          IN_MARKET: ${{ github.event.inputs.market }}
          IN_DRY: ${{ github.event.inputs.dry }}
        shell: bash
        run: |
          # les entrées du formulaire passent par des variables (jamais interpolées dans le script)
          FLAGS=()
          if [ -n "$IN_SLOT" ]; then FLAGS=(--slot "$IN_SLOT" --market "${IN_MARKET:-fr}"); fi
          if [ "$IN_DRY" = "1" ]; then export IG_DRY_RUN=1; fi
          if [ "$IN_DRY" = "0" ]; then export IG_DRY_RUN=0; fi
          node run.js "${FLAGS[@]}"

      - name: Visuels du jour
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visuels-${{ github.run_id }}
          path: ig-media/posts/${{ env.TODAY }}-*/**
          if-no-files-found: ignore
          retention-days: 14
