# Balayage continu Aeryndo : appelle le robot toutes les 30 minutes.
# NB (13 oct. 2026) : le planificateur GitHub n'honore pas cette fréquence (4 à 7 passages par jour constatés).
# Le déclenchement fiable vient de cron-job.org, qui appelle https://www.aeryndo.co/api/scan directement
# toutes les 30 minutes ; ce workflow reste en filet de sécurité.
# Gratuit sur un dépôt public. Secret à créer dans GitHub → Settings → Secrets → Actions :
#   CRON_SECRET = la même valeur que la variable CRON_SECRET de Vercel.
# NB : l'adresse doit être www.aeryndo.co (aeryndo.co renvoie une redirection 308,
# que curl ne suit pas sans -L : le robot n'était jamais appelé). On garde -L par sécurité
# et on échoue si la réponse n'est pas un succès HTTP (pour voir une croix rouge, pas une
# coche verte trompeuse).
name: scan
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Appel du robot
        shell: bash
        run: |
          set -o pipefail
          curl -sS -L --fail-with-body --max-time 120 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "https://www.aeryndo.co/api/scan" | head -c 2000
